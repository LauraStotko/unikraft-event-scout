name: Weekly Event Scout

on:
  # Runs every Monday at 08:00 UTC
  schedule:
    - cron: "0 8 * * 1"

  # Allow manual trigger from the GitHub Actions UI at any time.
  # Each category below can be toggled yes/no; all default to "yes".
  workflow_dispatch:
    inputs:
      include_conferences:
        description: "Include conferences (find new upcoming conferences)?"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      include_cfp:
        description: "Include CFP (conferences with an open Call for Papers)?"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      include_meetups:
        description: "Include meetups (SF/Munich/Berlin/Bucharest/London/Dublin)?"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      include_demos:
        description: "Include SF product-demo events?"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      dry_run:
        description: "Dry run (skip writing to Google Sheets)?"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      force_web_search:
        description: "Force next-edition + CFP-refresh web search regardless of throttle?"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

jobs:
  scout:
    name: Scrape, classify, and update sheet
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run event scout agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          # Store your full service account JSON as a single GitHub secret
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Category toggles — default to "yes" on scheduled runs (empty inputs)
          INCLUDE_CONFERENCES: ${{ github.event.inputs.include_conferences || 'yes' }}
          INCLUDE_CFP: ${{ github.event.inputs.include_cfp || 'yes' }}
          INCLUDE_MEETUPS: ${{ github.event.inputs.include_meetups || 'yes' }}
          INCLUDE_DEMOS: ${{ github.event.inputs.include_demos || 'yes' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'no' }}
          FORCE_WEB_SEARCH: ${{ github.event.inputs.force_web_search || 'no' }}
        run: python main.py

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scout-failure-log
          path: "*.log"
          retention-days: 7
